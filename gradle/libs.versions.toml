espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.8.6"
activityCompose = "1.9.3"
composeBom = "2024.10.00"
firebaseBom = "33.4.0"
firebaseFirestoreKtx = "25.1.0"
mockitoCore = "5.14.2"
navigationCompose = "2.8.3"
serialization = "1.6.3"
gms = "4.4.2"
room = "2.6.1"
ksp = "2.0.20-1.0.24"
