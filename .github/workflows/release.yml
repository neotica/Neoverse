name: Production Builds

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
  workflow_dispatch:
    inputs:
      name:
        description: "Trigger CI/CD workflow"
        default: "Generate release build"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up JDK (Java 17 recommended)
      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: 17

      # Install Android SDK Command Line Tools
      - name: Install Android SDK Command Line Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sS -o sdk-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip
          unzip -qq sdk-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm sdk-tools.zip

      # Install Android SDK Components (29.0.3 and 33.0.0)
      - name: Install Android SDK Components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" \
            "build-tools;29.0.3" "build-tools;33.0.0" "platforms;android-33"

      # Grant execute permissions to Gradle wrapper
      - name: Grant execute permissions for Gradle wrapper
        run: chmod +x gradlew

      # Build APK (release version)
      - name: Build APK
        run: ./gradlew assembleRelease

      # Debugging step (optional)
      - name: Debug Build Tools
        run: |
          echo "Checking Build Tools directory:"
          ls -al $ANDROID_HOME/build-tools
          echo "Checking PATH variable:"
          echo $PATH

      # Sign APK using Base64 encoded keystore
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE_64 }}
          alias: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # Upload signed APK to Firebase App Distribution
      - name: Upload signed APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: testers
          file: ${{ steps.sign_app.outputs.signedReleaseFile }}

      # Upload signed APK as an artifact for later use
      - name: Upload signed APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signed APK
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}